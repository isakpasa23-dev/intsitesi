<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3436"/>
      <stop offset="100%" stop-color="#1e272e"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="100%" stop-color="#ffd6e2"/>
    </linearGradient>
    <linearGradient id="camGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#00cec9"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ff758c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Arka Plan Parlama Dairesi -->
  <circle cx="60" cy="60" r="54" fill="#fff5f8" stroke="#ffd6df" stroke-width="2" filter="url(#phoneShadow)"/>

  <!-- Akıllı Telefon Kasası -->
  <rect x="36" y="16" width="48" height="88" rx="10" fill="url(#phoneBody)" stroke="#636e72" stroke-width="1.5"/>
  
  <!-- Ekran -->
  <rect x="39" y="24" width="42" height="72" rx="6" fill="url(#screenGrad)"/>

  <!-- Üst Ahize & Kamera Çentiği -->
  <rect x="52" y="19" width="16" height="3" rx="1.5" fill="#636e72"/>
  <circle cx="46" cy="20.5" r="1.5" fill="#0984e3"/>

  <!-- Görüntülü Arama Ekranı İçeriği (Yüz & Kalpler) -->
  <!-- Arayan Sevgili Avatarı -->
  <circle cx="60" cy="46" r="14" fill="#ff758c"/>
  <circle cx="60" cy="42" r="6" fill="#ffeaa7"/>
  <path d="M 50 56 C 50 50, 70 50, 70 56" fill="#ffeaa7"/>
  <!-- Yüz İfadesi & Kalp -->
  <circle cx="58" cy="41" r="1" fill="#2d3436"/>
  <circle cx="62" cy="41" r="1" fill="#2d3436"/>
  <path d="M 58 44 Q 60 46 62 44" stroke="#2d3436" stroke-width="0.8" fill="none"/>

  <!-- Uçuşan Kalp -->
  <g transform="translate(68, 32) scale(0.6)">
    <path d="M 0 0 C -6 -10, -18 0, 0 16 C 18 0, 6 -10, 0 0 Z" fill="#ff1361"/>
  </g>

  <!-- Yeşil Kamera / Video Arama İkonu -->
  <rect x="50" y="68" width="20" height="14" rx="4" fill="url(#camGreen)"/>
  <polygon points="70,72 78,68 78,82 70,78" fill="url(#camGreen)"/>
  <circle cx="58" cy="75" r="2.5" fill="#ffffff"/>

  <!-- Çevredeki Sinyal & Parıltılar 📱✨ -->
  <text x="14" y="38" font-size="14">📹</text>
  <text x="86" y="42" font-size="13">💖</text>
  <text x="84" y="94" font-size="12">✨</text>
  <text x="16" y="90" font-size="13">📞</text>
</svg>
