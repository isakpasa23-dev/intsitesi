<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="100%" stop-color="#ff1361" />
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa3b8" />
      <stop offset="100%" stop-color="#ff547d" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7" />
      <stop offset="100%" stop-color="#fdcb6e" />
    </linearGradient>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7" />
      <stop offset="100%" stop-color="#ffe4ec" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arka Plan Daire -->
  <circle cx="120" cy="120" r="105" fill="url(#bgGrad2)" stroke="#ffccd7" stroke-width="3" />

  <!-- Kutu Gövdesi -->
  <rect x="65" y="115" width="110" height="75" rx="14" fill="url(#boxGrad)" filter="url(#glow2)" />
  <rect x="65" y="115" width="110" height="75" rx="14" fill="url(#boxGrad)" />

  <!-- Kutu Kapağı -->
  <rect x="55" y="98" width="130" height="24" rx="8" fill="url(#lidGrad)" stroke="#ffffff" stroke-width="1.5" />

  <!-- Şeritler -->
  <rect x="110" y="115" width="20" height="75" fill="url(#ribbonGrad)" />
  <rect x="110" y="98" width="20" height="24" fill="url(#ribbonGrad)" />

  <!-- Kurdele Fiyonk -->
  <!-- Sol Kulak -->
  <path d="M120 98 C100 70, 75 75, 85 92 C95 102, 115 98, 120 98 Z" fill="url(#ribbonGrad)" stroke="#e17055" stroke-width="1" />
  <!-- Sağ Kulak -->
  <path d="M120 98 C140 70, 165 75, 155 92 C145 102, 125 98, 120 98 Z" fill="url(#ribbonGrad)" stroke="#e17055" stroke-width="1" />
  <!-- Düğüm -->
  <circle cx="120" cy="98" r="8" fill="#ffeaa7" stroke="#fab1a0" stroke-width="2" />

  <!-- Kutudan Çıkan Kalpler & Sevimli Işıltılar -->
  <path d="M120 60 C120 60, 110 45, 98 52 C86 59, 90 75, 120 92 C150 75, 154 59, 142 52 C130 45, 120 60, 120 60 Z" fill="#ff1361" filter="url(#glow2)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="2s" repeatCount="indefinite" />
  </path>
  
  <path d="M68 55 C68 55, 62 45, 54 50 C46 55, 48 65, 68 76 C88 65, 90 55, 82 50 C74 45, 68 55, 68 55 Z" fill="#ff758c" opacity="0.9" />
  <path d="M172 65 C172 65, 166 57, 160 61 C154 65, 156 73, 172 82 C188 73, 190 65, 184 61 C178 57, 172 65, 172 65 Z" fill="#ff4b72" opacity="0.9" />

  <!-- Yıldız / Pırıltılar -->
  <polygon points="120,30 123,37 130,40 123,43 120,50 117,43 110,40 117,37" fill="#ffd700" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" values="0 120 40; 360 120 40" dur="6s" repeatCount="indefinite" />
  </polygon>
  <polygon points="50,110 52,114 56,116 52,118 50,122 48,118 44,116 48,114" fill="#ffd700" opacity="0.8" />
  <polygon points="190,115 192,119 196,121 192,123 190,127 188,123 184,121 188,119" fill="#ffd700" opacity="0.8" />
</svg>
