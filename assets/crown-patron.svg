<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="40%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#e17055"/>
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="100%" stop-color="#ff1361"/>
    </linearGradient>
    <filter id="crownShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#fdcb6e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Arka Plan Parlama Dairesi -->
  <circle cx="60" cy="60" r="54" fill="#fff9eb" stroke="#ffeaa7" stroke-width="2" filter="url(#crownShadow)"/>

  <!-- Altın Taç Gövdesi -->
  <g transform="translate(18, 25)">
    <!-- Taç Taban Bandı -->
    <path d="M 6 52 C 28 58, 56 58, 78 52 L 74 62 C 54 67, 30 67, 10 62 Z" fill="#d68016"/>
    <path d="M 6 49 C 28 55, 56 55, 78 49 L 76 57 C 54 63, 30 63, 8 57 Z" fill="url(#crownGold)"/>

    <!-- Taç Sivri Uçları (5 Zirve) -->
    <path d="M 6 49 L 10 24 L 26 36 L 42 12 L 58 36 L 74 24 L 78 49 C 56 55, 28 55, 6 49 Z" fill="url(#crownGold)" stroke="#d68016" stroke-width="1.5"/>

    <!-- Taç Tepesindeki Mücevherler (İnciler & Yakutlar) -->
    <circle cx="10" cy="23" r="4.5" fill="#ffffff" stroke="#e17055" stroke-width="1"/>
    <circle cx="26" cy="35" r="3.5" fill="url(#rubyGrad)"/>
    
    <!-- Orta Zirve (Büyük Aşk Yakutu / Kalp) -->
    <circle cx="42" cy="11" r="6" fill="#ffffff" stroke="#e17055" stroke-width="1.2"/>
    <circle cx="42" cy="11" r="3.5" fill="url(#rubyGrad)"/>

    <circle cx="58" cy="35" r="3.5" fill="url(#rubyGrad)"/>
    <circle cx="74" cy="23" r="4.5" fill="#ffffff" stroke="#e17055" stroke-width="1"/>

    <!-- Taç Üzerindeki Elmaslar -->
    <polygon points="42,32 46,38 42,44 38,38" fill="#74b9ff"/>
    <circle cx="24" cy="45" r="3" fill="url(#rubyGrad)"/>
    <circle cx="60" cy="45" r="3" fill="url(#rubyGrad)"/>
    <circle cx="42" cy="50" r="2.5" fill="#ffeaa7"/>
  </g>

  <!-- Parıltı Yıldızları & Kalpler ✨💖 -->
  <text x="86" y="30" font-size="14">✨</text>
  <text x="16" y="36" font-size="12">⭐</text>
  <text x="84" y="98" font-size="13">👑</text>
  <text x="18" y="96" font-size="12">💖</text>
</svg>
