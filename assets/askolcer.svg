<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="meterGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="50%" stop-color="#ff4b72" />
      <stop offset="100%" stop-color="#ff1361" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5" />
      <stop offset="100%" stop-color="#ffe4ec" />
    </linearGradient>
  </defs>

  <!-- Arka Plan Daire -->
  <circle cx="120" cy="120" r="105" fill="url(#bgGrad)" stroke="#ffb6c1" stroke-width="3" />

  <!-- Aşkölçer Tüpü / Gövde -->
  <rect x="95" y="45" width="50" height="110" rx="25" fill="#ffffff" stroke="#ff8da1" stroke-width="4" />
  
  <!-- Cıva / Sıvı (Aşk Seviyesi %100 Max) -->
  <rect x="101" y="60" width="38" height="90" rx="19" fill="url(#meterGrad)" />
  
  <!-- Alt Küre Hazne -->
  <circle cx="120" cy="155" r="34" fill="url(#meterGrad)" filter="url(#glow)" />
  <circle cx="120" cy="155" r="32" fill="url(#meterGrad)" stroke="#ffffff" stroke-width="3" />

  <!-- Seviye Çizgileri -->
  <line x1="83" y1="65" x2="93" y2="65" stroke="#ff4b72" stroke-width="3" stroke-linecap="round" />
  <line x1="85" y1="85" x2="93" y2="85" stroke="#ff8da1" stroke-width="2" stroke-linecap="round" />
  <line x1="83" y1="105" x2="93" y2="105" stroke="#ff4b72" stroke-width="3" stroke-linecap="round" />
  <line x1="85" y1="125" x2="93" y2="125" stroke="#ff8da1" stroke-width="2" stroke-linecap="round" />

  <!-- Ölçer İbre Kalbi -->
  <path d="M120 40 C120 40, 114 32, 108 36 C102 40, 104 48, 120 60 C136 48, 138 40, 132 36 C126 32, 120 40, 120 40 Z" fill="#ff1361" filter="url(#glow)" />

  <!-- Parlama Efekti -->
  <circle cx="110" cy="148" r="8" fill="#ffffff" opacity="0.6" />
  <circle cx="106" cy="143" r="3" fill="#ffffff" opacity="0.8" />

  <!-- Küçük Uçuşan Kalpler -->
  <path d="M60 85 C60 85, 56 80, 52 82 C48 84, 49 90, 60 98 C71 90, 72 84, 68 82 C64 80, 60 85, 60 85 Z" fill="#ff758c" opacity="0.85" />
  <path d="M180 95 C180 95, 176 90, 172 92 C168 94, 169 100, 180 108 C191 100, 192 94, 188 92 C184 90, 180 95, 180 95 Z" fill="#ff4b72" opacity="0.85" />
  <path d="M170 150 C170 150, 167 146, 164 148 C161 150, 162 154, 170 160 C178 154, 179 150, 176 148 C173 146, 170 150, 170 150 Z" fill="#ff758c" opacity="0.7" />
</svg>
