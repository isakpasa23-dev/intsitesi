<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="kissRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="50%" stop-color="#ff1361"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="kissGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="kissShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ff1361" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Arka Plan Parlama Dairesi -->
  <circle cx="60" cy="60" r="54" fill="#fff0f5" stroke="#ffd1dc" stroke-width="2" filter="url(#kissShadow)"/>

  <!-- Öpücük Dudak İzi (Glossy Lips) -->
  <g transform="translate(14, 25) rotate(-6 46 35)">
    <!-- Üst Dudak (İki Kavisli Tepe & Yay) -->
    <path d="M 12 36 C 24 22, 38 24, 46 32 C 54 24, 68 22, 80 36 C 68 40, 56 38, 46 42 C 36 38, 24 40, 12 36 Z" fill="url(#kissRed)"/>
    
    <!-- Üst Dudak Parlaması -->
    <path d="M 22 28 C 30 24, 38 26, 42 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 50 30 C 54 26, 62 24, 70 28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Dudak Ayrım Çizgisi -->
    <path d="M 14 36 Q 46 45 78 36" stroke="#800020" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Alt Dudak (Dolgun Kavis) -->
    <path d="M 14 38 C 24 58, 68 58, 78 38 C 66 45, 26 45, 14 38 Z" fill="url(#kissRed)"/>
    
    <!-- Alt Dudak Parlaması -->
    <path d="M 32 50 Q 46 54 60 50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>

  <!-- Uçuşan Küçük Kalpler & Işıltılar 💖✨ -->
  <g transform="translate(86, 20) scale(0.55)">
    <path d="M 0 0 C -6 -10, -18 0, 0 16 C 18 0, 6 -10, 0 0 Z" fill="#ff1361"/>
  </g>

  <text x="14" y="38" font-size="13">💋</text>
  <text x="86" y="94" font-size="14">✨</text>
  <text x="16" y="96" font-size="12">🥰</text>
</svg>
